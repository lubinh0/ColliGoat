<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colligoat — Tennis Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0B1628;--bg2:#0f1e35;--bg3:#112240;--bg4:#1A3357;
  --accent:#2E7CF6;--yellow:#C9C000;--yellow2:#D4CC00;
  --white:#F0F4FF;--mid:#9EB3D8;--dim:#4A6285;
  --border:#1A3357;--borderl:#243F6A;
  --danger:#FF6B6B;--live:#3FC87A;
}
html{background:#060e1a;}body{background:#060e1a;}
body{font-family:'Inter',sans-serif;color:var(--white);display:flex;justify-content:center;padding:20px;min-height:100vh;}
.app{width:100%;max-width:780px;background:var(--bg);border-radius:16px;overflow:visible;border:1px solid var(--border);}

.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:12px;}
.lt{font-size:24px;font-weight:900;letter-spacing:-0.5px;line-height:1;}
.lt .c1{color:var(--white);}
.lt .c2{color:var(--accent);}
.lsub{font-size:9px;letter-spacing:5px;color:var(--dim);margin-top:3px;}
.data-status{font-size:10px;display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 10px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);}
.status-dot.loading{background:var(--yellow);animation:pulse 1s infinite;}
.status-dot.ok{background:var(--live);}
.status-dot.error{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.date-nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;white-space:nowrap;}
.date-nav::-webkit-scrollbar{height:3px;}
.date-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.day-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:transparent;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;gap:1px;}
.day-btn:hover{border-color:var(--borderl);background:var(--bg3);}
.day-btn.on{background:var(--yellow);border-color:var(--yellow);}
.day-btn .dday{font-size:10px;font-weight:600;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
.day-btn .dnum{font-size:20px;font-weight:900;color:var(--white);line-height:1.1;}
.day-btn .dmon{font-size:10px;color:var(--dim);font-weight:500;}
.day-btn .dnb{font-size:9px;background:var(--bg4);color:var(--mid);border-radius:10px;padding:2px 6px;margin-top:3px;font-weight:600;}
.day-btn.on .dday,.day-btn.on .dnum,.day-btn.on .dmon{color:#0B1628;}
.day-btn.on .dnb{background:rgba(11,22,40,.25);color:#0B1628;}

.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);}
.tab{flex:1;padding:14px 0;text-align:center;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;letter-spacing:.5px;border-bottom:3px solid transparent;transition:all .15s;text-transform:uppercase;}
.tab.on{color:var(--white);border-bottom-color:var(--yellow);}
.tab:hover:not(.on){color:var(--mid);}

.body{padding:20px 24px;}
.sec{display:none;}
.sec.on{display:block;}

.tourn-block{margin-bottom:20px;}
.tourn-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.tourn-name{font-size:11px;font-weight:700;color:var(--mid);letter-spacing:2px;text-transform:uppercase;}
.tourn-surf{font-size:10px;color:var(--dim);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:2px 8px;letter-spacing:1px;}
.tourn-date{font-size:10px;color:var(--dim);margin-left:auto;font-weight:500;}

.mrow{background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .15s;overflow:hidden;}
.mrow:hover{border-color:var(--borderl);background:var(--bg3);}
.mrow.open{border-color:var(--accent);}
.mmain{display:grid;grid-template-columns:1fr auto;align-items:center;padding:13px 16px;gap:12px;}
.players{display:flex;flex-direction:column;gap:7px;}
.pline{display:flex;align-items:center;gap:8px;}
.pflag{font-size:14px;width:22px;text-align:center;}
.pname{font-size:14px;font-weight:700;color:var(--white);flex:1;letter-spacing:-.2px;}
.prank{font-size:10px;color:var(--dim);background:var(--bg);border-radius:4px;padding:2px 7px;font-weight:600;}
.pprob{font-size:13px;font-weight:800;color:var(--dim);min-width:38px;text-align:right;}
.pprob.fav{color:var(--yellow);}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
.adv{font-size:10px;padding:3px 10px;border-radius:5px;font-weight:700;white-space:nowrap;}
.ae{background:rgba(255,107,107,.15);color:#FF8080;border:1px solid rgba(255,107,107,.2);}
.ah{background:rgba(201,192,0,.12);color:#D4CC00;border:1px solid rgba(201,192,0,.2);}
.am{background:rgba(63,200,122,.1);color:#3FC87A;border:1px solid rgba(63,200,122,.2);}
.al{background:var(--bg3);color:var(--dim);border:1px solid var(--border);}
.mtime{font-size:10px;color:var(--dim);font-weight:500;}
.chev{width:16px;height:16px;color:var(--dim);transition:transform .2s;flex-shrink:0;}
.mrow.open .chev{transform:rotate(180deg);}

.mdiv{height:1px;background:var(--border);margin:0 16px;}
.mdetail{display:none;padding:16px;}
.mrow.open .mdetail{display:block;}

.loading-detail{text-align:center;padding:1.5rem;color:var(--dim);font-size:12px;font-weight:500;}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--yellow);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px;}
@keyframes spin{to{transform:rotate(360deg);}}

.prob-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600;}
.pbtrack{height:7px;border-radius:4px;background:var(--bg);overflow:hidden;display:flex;margin-bottom:14px;}
.pbl{background:var(--yellow);}
.pbr{background:var(--accent);}
.pond-note{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-bottom:14px;letter-spacing:.5px;font-weight:500;}
.stat-hdr{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px;font-weight:700;letter-spacing:.5px;}
.slbl2{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin:12px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.sr{display:grid;grid-template-columns:1fr 120px 1fr;gap:6px;align-items:center;margin-bottom:6px;}
.sv{font-size:13px;font-weight:700;}
.sv.g{color:var(--live);}
.sv.b{color:var(--danger);}
.sv.n{color:var(--mid);}
.svr{text-align:right;}
.slbl{font-size:10px;color:var(--dim);text-align:center;letter-spacing:.3px;}
.sbar{display:grid;grid-template-columns:1fr 1fr;gap:1px;height:3px;border-radius:2px;overflow:hidden;margin-top:3px;}
.sbl{background:var(--yellow);}
.sbr{background:var(--accent);}

.h2h-box{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:12px;}
.h2h-title{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;}
.h2h-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.h2h-item{text-align:center;}
.h2h-val{font-size:18px;font-weight:900;color:var(--white);}
.h2h-lbl{font-size:10px;color:var(--dim);margin-top:2px;}
.h2h-last{font-size:11px;color:var(--mid);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.5;}

.ins{display:flex;gap:9px;align-items:flex-start;margin-bottom:6px;font-size:12px;color:var(--mid);line-height:1.5;background:var(--bg);border-radius:7px;padding:9px 12px;}
.idot{width:6px;height:6px;border-radius:50%;margin-top:3px;flex-shrink:0;}
.idot.g{background:var(--live);}
.idot.r{background:var(--danger);}
.idot.y{background:var(--yellow);}
.idot.b{background:var(--accent);}
.vbtn{width:100%;margin-top:14px;padding:11px;background:var(--yellow);border:none;border-radius:8px;color:#0B1628;font-size:12px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:1px;transition:all .15s;text-transform:uppercase;}
.vbtn:hover{background:var(--yellow2);transform:translateY(-1px);}

.vc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
.vtit{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;}
.prob2grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.pb-box{border-radius:10px;padding:14px;text-align:center;}
.pb-y{background:rgba(201,192,0,.1);border:1px solid rgba(201,192,0,.2);}
.pb-b{background:rgba(46,124,246,.1);border:1px solid rgba(46,124,246,.2);}
.pb-num{font-size:28px;font-weight:900;line-height:1;}
.pb-lbl{font-size:11px;color:var(--dim);margin-top:5px;font-weight:600;}
.oig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.olg{display:flex;flex-direction:column;gap:6px;}
.olk{font-size:11px;color:var(--mid);font-weight:700;letter-spacing:.5px;}
.oi{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:18px;font-weight:700;padding:11px;width:100%;font-family:'Inter',sans-serif;text-align:center;transition:border-color .15s;}
.oi:focus{outline:none;border-color:var(--yellow);}
.vrow{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:8px;padding:12px 14px;margin-bottom:8px;}
.vinfo{font-size:13px;color:var(--mid);line-height:1.6;font-weight:500;}
.vedge{font-size:18px;font-weight:900;white-space:nowrap;margin-left:14px;}
.how-to{font-size:11px;color:var(--dim);line-height:1.7;font-weight:500;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}

.surf-note{font-size:10px;color:var(--dim);margin-bottom:14px;display:flex;align-items:center;gap:6px;font-weight:600;letter-spacing:1px;}
.surf-dot{width:7px;height:7px;border-radius:50%;background:var(--live);}
table{width:100%;border-collapse:collapse;}
th{padding:8px;font-size:10px;color:var(--dim);font-weight:700;text-align:center;border-bottom:1px solid var(--borderl);letter-spacing:1px;text-transform:uppercase;}
th:first-child{text-align:left;}
td{padding:9px 8px;font-size:12px;border-bottom:1px solid var(--border);font-weight:600;text-align:center;}
td:first-child{color:var(--white);text-align:left;white-space:nowrap;}
tr:hover td{background:var(--bg2);}
.empty{text-align:center;padding:3rem;color:var(--dim);font-size:13px;font-weight:500;}
.footer{background:var(--bg2);border-top:1px solid var(--border);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;}
.footer-txt{font-size:10px;color:var(--dim);letter-spacing:.5px;}
.no-data{font-size:11px;color:var(--dim);font-style:italic;}
.odds-col{display:flex;flex-direction:column;gap:7px;align-items:flex-end;margin-right:8px;}
.odd-chip{font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;min-width:38px;text-align:center;}
.odd-value{background:rgba(63,200,122,.15);color:#3FC87A;border:1px solid rgba(63,200,122,.3);}
.odd-novalue{background:rgba(255,107,107,.12);color:#FF8080;border:1px solid rgba(255,107,107,.25);}
.odd-neutral{background:var(--bg3);color:var(--mid);border:1px solid var(--border);}
.odd-none{background:transparent;color:var(--dim);border:1px solid transparent;font-size:10px;}
.surf-search{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:13px;padding:10px 14px;margin-bottom:14px;font-family:'Inter',sans-serif;transition:border-color .15s;}
.surf-search:focus{outline:none;border-color:var(--yellow);}
.surf-search::placeholder{color:var(--dim);}
</style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" fill="#C9C000"/>
        <path d="M1,20 Q10,7 20,6 Q30,7 39,20" stroke="#F5F0D0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M1,20 Q10,33 20,34 Q30,33 39,20" stroke="#F5F0D0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
      <div>
        <div class="lt"><span class="c1">Colli</span><span class="c2">goat</span></div>
        <div class="lsub">TENNIS ANALYTICS</div>
      </div>
    </div>
    <div class="data-status">
      <div class="status-dot loading" id="status-dot"></div>
      <span id="status-text" style="color:var(--dim);font-size:10px;">Chargement des données...</span>
    </div>
  </div>

  <div class="date-nav" id="date-nav"></div>

  <div class="tabs">
    <div class="tab on" onclick="sw('matches')">Matchs</div>
    <div class="tab" onclick="sw('podium')">🏆 Podium</div>
    <div class="tab" onclick="sw('surf')">Surfaces</div>
  </div>

  <div class="body">
    <div id="t-matches" class="sec on"><div id="mlist"><div class="empty">Chargement des données...</div></div></div>
    <div id="t-podium" class="sec"><div id="podium-cont"></div></div>
    <div id="t-surf" class="sec"><div id="scont"></div></div>
  </div>

  <div class="footer">
    <div class="footer-txt">Données · Tennis Abstract (Jeff Sackmann) · CC BY-NC-SA</div>
    <div class="footer-txt">Stats pondérées · 6 mois glissants · filtrées par surface</div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const BASE = './';
const CSV_FILES = [
  {url: BASE + 'atp_matches_2026.csv', tour: 'atp'},
  {url: BASE + 'atp_matches_2025.csv', tour: 'atp'},
  {url: BASE + 'wta_matches_2026.csv', tour: 'wta'},
  {url: BASE + 'wta_matches_2025.csv', tour: 'wta'},
];

const SM = {Clay:'Terre battue', Hard:'Dur', Grass:'Gazon'};
const FL = {
  'Sinner J':'🇮🇹','Sinner J.':'🇮🇹','Zverev A':'🇩🇪','Zverev A.':'🇩🇪',
  'Alcaraz C':'🇪🇸','Alcaraz C.':'🇪🇸','Djokovic N':'🇷🇸','Djokovic N.':'🇷🇸',
  'Medvedev D':'🇷🇺','Medvedev D.':'🇷🇺','Fritz T':'🇺🇸','Fritz T.':'🇺🇸',
  'Rublev A':'🇷🇺','Rublev A.':'🇷🇺','Tsitsipas S':'🇬🇷','Tsitsipas S.':'🇬🇷',
  'Swiatek I':'🇵🇱','Swiatek I.':'🇵🇱','Sabalenka A':'🇧🇾','Sabalenka A.':'🇧🇾',
  'Gauff C':'🇺🇸','Gauff C.':'🇺🇸','Paolini J':'🇮🇹','Paolini J.':'🇮🇹',
  'Kasatkina D':'🇷🇺','Kasatkina D.':'🇷🇺','Keys M':'🇺🇸','Keys M.':'🇺🇸',
  'Muller A':'🇫🇷','Muller A.':'🇫🇷','Humbert U':'🇫🇷','Humbert U.':'🇫🇷',
  'Nadal R':'🇪🇸','Nadal R.':'🇪🇸','Wawrinka S':'🇨🇭','Wawrinka S.':'🇨🇭',
};

// ─── UPCOMING MATCHES (chargées depuis matches.json) ─────────────────────────
let DAYS = [];

const DAYS_FR = ['Dim.','Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.'];
const MONTHS_FR = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const SURFACE_FLAGS = {'Roland Garros':'🇫🇷','Wimbledon':'🇬🇧','US Open':'🇺🇸','Australian Open':'🇦🇺'};
const COUNTRY_FLAGS = {
  'France':'🇫🇷','Spain':'🇪🇸','Italy':'🇮🇹','Serbia':'🇷🇸','Russia':'🇷🇺',
  'Germany':'🇩🇪','United States':'🇺🇸','Poland':'🇵🇱','Belarus':'🇧🇾',
  'Greece':'🇬🇷','Argentina':'🇦🇷','Australia':'🇦🇺','Switzerland':'🇨🇭',
  'United Kingdom':'🇬🇧','Czech Republic':'🇨🇿','Romania':'🇷🇴','Denmark':'🇩🇰',
  'Norway':'🇳🇴','Canada':'🇨🇦','Japan':'🇯🇵','China':'🇨🇳','Belgium':'🇧🇪',
  'Kazakhstan':'🇰🇿','Bulgaria':'🇧🇬','Croatia':'🇭🇷','Netherlands':'🇳🇱',
};

// Convertit le JSON RapidAPI en format DAYS
function parseMatchesJSON(data) {
  const days = [];
  const COUNTRY_ACR = {
    'ESP':'🇪🇸','ITA':'🇮🇹','FRA':'🇫🇷','GER':'🇩🇪','USA':'🇺🇸','ARG':'🇦🇷',
    'SRB':'🇷🇸','RUS':'🇷🇺','POL':'🇵🇱','BLR':'🇧🇾','GRE':'🇬🇷','AUS':'🇦🇺',
    'SUI':'🇨🇭','GBR':'🇬🇧','CZE':'🇨🇿','ROU':'🇷🇴','DEN':'🇩🇰','NOR':'🇳🇴',
    'CAN':'🇨🇦','JPN':'🇯🇵','CHN':'🇨🇳','BEL':'🇧🇪','KAZ':'🇰🇿','BUL':'🇧🇬',
    'CRO':'🇭🇷','NED':'🇳🇱','BRA':'🇧🇷','AUT':'🇦🇹','POR':'🇵🇹','SWE':'🇸🇪',
    'MAR':'🇲🇦','KOR':'🇰🇷','UKR':'🇺🇦','SVK':'🇸🇰',
  };

  function processDay(dateStr, matchList, isTbc) {
    if (!matchList || matchList.length === 0) return null;
    const dateObj = isTbc ? new Date() : new Date(dateStr);
    const label = DAYS_FR[dateObj.getDay()];
    const num = isTbc ? '?' : String(dateObj.getDate());
    const mon = MONTHS_FR[dateObj.getMonth()];

    const tournMap = {};
    matchList.forEach(m => {
      const tInfo = m.tournament || {};
      const tName = tInfo.name || m.sport_title || 'Tournoi';
      const surface = tInfo.surface || 'Clay';
      const flag = tInfo.flag || '🎾';
      // Utiliser le nom comme clé car The Odds API n'a pas de tournamentId
      const tKey = tName;

      if (!tournMap[tKey]) tournMap[tKey] = {name: tName, flag, surface, matches: []};

      const p1name = m.player1?.name || '?';
      const p2name = m.player2?.name || '?';
      const p1acr = m.player1?.countryAcr || '';
      const p2acr = m.player2?.countryAcr || '';

      if (p1acr && COUNTRY_ACR[p1acr]) FL[p1name] = COUNTRY_ACR[p1acr];
      if (p2acr && COUNTRY_ACR[p2acr]) FL[p2name] = COUNTRY_ACR[p2acr];

      // Utiliser le time déjà calculé dans le workflow ou recalculer
      let timeStr = m.time || 'À confirmer';
      let scheduled = !!m.scheduled;

      const round = m.roundId ? `Tour ${m.roundId}` : '';
      const id = m.id ? `${dateStr}-${m.id}` : `${dateStr}-${p1name.slice(0,4)}-${p2name.slice(0,4)}`;

      tournMap[tKey].matches.push({id, p1: p1name, p2: p2name, r: round, time: timeStr, scheduled});
    });

    // Trier dans chaque tournoi : programmés d'abord puis TBC
    Object.values(tournMap).forEach(t => {
      t.matches.sort((a, b) => {
        if (a.scheduled && !b.scheduled) return -1;
        if (!a.scheduled && b.scheduled) return 1;
        return a.time.localeCompare(b.time);
      });
    });

    const tournaments = Object.values(tournMap).filter(t => t.matches.length > 0);
    if (tournaments.length === 0) return null;
    return {label, num, mon, date: dateStr, isTbc, tournaments};
  }

  // Dates normales
  Object.keys(data).filter(d => d !== 'tbc').sort().forEach(dateStr => {
    const day = processDay(dateStr, data[dateStr].data, false);
    if (day) days.push(day);
  });

  // Matchs sans date
  if (data['tbc'] && data['tbc'].data && data['tbc'].data.length > 0) {
    const day = processDay('tbc', data['tbc'].data, true);
    if (day) {
      day.label = '?';
      day.num = '?';
      day.mon = 'TBC';
      days.push(day);
    }
  }

  return days;
}

// ─── DATA ENGINE ──────────────────────────────────────────────────────────────
let allRows = []; // toutes les lignes CSV chargées
let playerCache = {}; // cache des stats calculées par joueur+surface
let dataLoaded = false;

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i]||'').trim().replace(/"/g,''));
    return obj;
  }).filter(r => r.tourney_date);
}

function normalizeName(name) {
  // Sackmann format: "Sinner J." ou "Alcaraz C." — on normalise
  if (!name) return '';
  return name.trim();
}

// Calcule les stats pondérées d'un joueur sur une surface donnée
// Fenêtre : 6 mois, pondération décroissante
function getPlayerStats(playerName, surface, asWinner=true) {
  const now = new Date('2026-05-18');
  const sixMonthsAgo = new Date(now);
  sixMonthsAgo.setMonth(sixMonthsAgo.getMonth() - 6);
  const cutoff = parseInt(sixMonthsAgo.toISOString().slice(0,10).replace(/-/g,''));

  // Chercher le joueur dans les données (flexible sur le format du nom)
  const rows = allRows.filter(r => {
    const name = asWinner ? r.winner_name : r.loser_name;
    if (!name) return false;
    const rName = normalizeName(name);
    const pName = playerName.replace('.','').trim();
    return rName.includes(pName.split(' ')[0]) &&
           (surface === 'All' || r.surface === surface) &&
           parseInt(r.tourney_date) >= cutoff;
  });

  if (rows.length === 0) return null;

  // Pondération : plus récent = plus de poids
  let totalWeight = 0;
  let s1pct = 0, s1won = 0, s2won = 0, aces = 0, df = 0, bpFaced = 0, bpSaved = 0, wins = 0;

  rows.forEach(r => {
    const matchDate = parseInt(r.tourney_date);
    const daysAgo = (now - new Date(String(matchDate).slice(0,4)+'-'+String(matchDate).slice(4,6)+'-'+String(matchDate).slice(6,8))) / (1000*60*60*24);
    const weight = Math.exp(-daysAgo / 90); // décroissance exponentielle ~3 mois

    const prefix = asWinner ? 'w_' : 'l_';
    const sp = parseFloat(r[prefix+'svpt']) || 0;
    const s1i = parseFloat(r[prefix+'1stIn']) || 0;
    const s1w = parseFloat(r[prefix+'1stWon']) || 0;
    const s2w = parseFloat(r[prefix+'2ndWon']) || 0;
    const s2pts = sp - s1i;
    const ac = parseFloat(r[prefix+'ace']) || 0;
    const d = parseFloat(r[prefix+'df']) || 0;
    const bpf = parseFloat(r[prefix+'bpFaced']) || 0;
    const bps = parseFloat(r[prefix+'bpSaved']) || 0;

    if (sp > 0) {
      totalWeight += weight;
      s1pct += weight * (s1i / sp * 100);
      s1won += weight * (s1i > 0 ? s1w / s1i * 100 : 0);
      s2won += weight * (s2pts > 0 ? s2w / s2pts * 100 : 0);
      aces += weight * ac;
      df += weight * d;
      bpFaced += weight * bpf;
      bpSaved += weight * (bpf > 0 ? bps / bpf * 100 : 0);
      wins += asWinner ? weight : 0;
    }
  });

  if (totalWeight === 0) return null;

  // Calcul win% sur la surface
  const totalOnSurface = allRows.filter(r => {
    const wname = normalizeName(r.winner_name||'');
    const lname = normalizeName(r.loser_name||'');
    const pName = playerName.replace('.','').trim();
    return (wname.includes(pName.split(' ')[0]) || lname.includes(pName.split(' ')[0])) &&
           (surface === 'All' || r.surface === surface) &&
           parseInt(r.tourney_date) >= cutoff;
  });
  const winsOnSurface = totalOnSurface.filter(r => {
    const wname = normalizeName(r.winner_name||'');
    const pName = playerName.replace('.','').trim();
    return wname.includes(pName.split(' ')[0]);
  });
  const winPct = totalOnSurface.length > 0 ? Math.round(winsOnSurface.length / totalOnSurface.length * 100) : 50;

  return {
    matches: rows.length,
    winPct,
    s1pct: Math.round(s1pct / totalWeight),
    s1won: Math.round(s1won / totalWeight),
    s2won: Math.round(s2won / totalWeight),
    aces: (aces / totalWeight).toFixed(1),
    df: (df / totalWeight).toFixed(1),
    bpConc: (bpFaced / totalWeight).toFixed(1),
    bpSaved: Math.round(bpSaved / totalWeight),
  };
}

// Stats combinées winner + loser pour un joueur
function getStats(playerName, surface) {
  const cacheKey = playerName + '_' + surface;
  if (playerCache[cacheKey]) return playerCache[cacheKey];

  const asW = getPlayerStats(playerName, surface, true);
  const asL = getPlayerStats(playerName, surface, false);

  let stats = null;
  if (asW && asL) {
    const tw = asW.matches, tl = asL.matches, total = tw + tl;
    const w = (a, b) => (a * tw + b * tl) / total;
    stats = {
      matches: total,
      winPct: asW.winPct, // win% calculé sur les deux
      s1pct: Math.round(w(asW.s1pct, asL.s1pct)),
      s1won: Math.round(w(asW.s1won, asL.s1won)),
      s2won: Math.round(w(asW.s2won, asL.s2won)),
      aces: ((parseFloat(asW.aces)*tw + parseFloat(asL.aces)*tl)/total).toFixed(1),
      df: ((parseFloat(asW.df)*tw + parseFloat(asL.df)*tl)/total).toFixed(1),
      bpConc: ((parseFloat(asW.bpConc)*tw + parseFloat(asL.bpConc)*tl)/total).toFixed(1),
      bpSaved: Math.round(w(asW.bpSaved, asL.bpSaved)),
    };
  } else if (asW) {
    stats = asW;
  } else if (asL) {
    stats = asL;
  }

  playerCache[cacheKey] = stats;
  return stats;
}

// H2H entre deux joueurs
function getH2H(p1, p2, surface) {
  const p1n = p1.replace('.','').trim().split(' ')[0];
  const p2n = p2.replace('.','').trim().split(' ')[0];

  const h2hRows = allRows.filter(r => {
    const wn = (r.winner_name||'').trim();
    const ln = (r.loser_name||'').trim();
    return (wn.includes(p1n) && ln.includes(p2n)) || (wn.includes(p2n) && ln.includes(p1n));
  });

  const onSurface = surface !== 'All' ? h2hRows.filter(r => r.surface === surface) : h2hRows;

  const p1wins = h2hRows.filter(r => (r.winner_name||'').includes(p1n)).length;
  const p2wins = h2hRows.filter(r => (r.winner_name||'').includes(p2n)).length;
  const p1winsS = onSurface.filter(r => (r.winner_name||'').includes(p1n)).length;
  const p2winsS = onSurface.filter(r => (r.winner_name||'').includes(p2n)).length;

  // Dernier match
  const sorted = [...h2hRows].sort((a,b) => parseInt(b.tourney_date) - parseInt(a.tourney_date));
  const last = sorted[0];
  let lastStr = null;
  if (last) {
    const date = String(last.tourney_date);
    const winner = (last.winner_name||'').includes(p1n) ? p1 : p2;
    lastStr = `Dernier : ${winner} · ${last.tourney_name||''} ${date.slice(0,4)}`;
  }

  return { p1wins, p2wins, p1winsS, p2winsS, total: h2hRows.length, totalS: onSurface.length, last: lastStr };
}

// Calcul probabilité de victoire
function calcProb(p1, p2, surface) {
  const a = getStats(p1, surface) || getFallback(p1);
  const b = getStats(p2, surface) || getFallback(p2);

  let s1 = a.winPct, s2 = b.winPct;
  s1 += (a.s1won - b.bpSaved * 0.5) * 0.15;
  s2 += (b.s1won - a.bpSaved * 0.5) * 0.15;
  s1 += (parseFloat(b.bpConc) - parseFloat(a.bpConc)) * 1.5;
  s2 += (parseFloat(a.bpConc) - parseFloat(b.bpConc)) * 1.5;

  const h2h = getH2H(p1, p2, surface);
  if (h2h.total > 0) {
    const h2hAdj = (h2h.p1winsS - h2h.p2winsS) / Math.max(h2h.totalS, 1) * 5;
    s1 += h2hAdj;
    s2 -= h2hAdj;
  }

  const t = s1 + s2;
  const p = Math.round(s1 / t * 100);
  return { p1: Math.max(5, Math.min(95, p)), p2: Math.max(5, Math.min(95, 100 - p)) };
}

// Fallback si pas de données CSV
function getFallback(name) {
  return { winPct: 50, s1pct: 63, s1won: 68, s2won: 49, aces: '4.0', df: '2.5', bpConc: '3.0', bpSaved: 62 };
}

function avScore(p1, p2) {
  const a = getStats(p1, 'All') || getFallback(p1);
  const b = getStats(p2, 'All') || getFallback(p2);
  const diff = Math.abs(a.winPct - b.winPct);
  return Math.min(9.9, (diff / 15 * 7 + 0.5)).toFixed(1);
}
function avInfo(s) {
  const v = parseFloat(s);
  return v>=7?{l:'Match à sens unique',c:'ae'}:v>=5?{l:'Match serré',c:'ah'}:v>=3?{l:'Match moyennement serré',c:'am'}:{l:'Match équilibré',c:'al'};
}

  const n1 = parseFloat(v1), n2 = parseFloat(v2);
  const w1 = isPct ? n1 : Math.min(90, Math.max(10, Math.round(n1 * 6)));
  const w2 = isPct ? n2 : Math.min(90, Math.max(10, Math.round(n2 * 6)));
  return `<div class="sr">

}

  openId = id;
  const row = document.getElementById('r-'+id);
  row.classList.add('open');
  if (!document.getElementById('d-'+id)) {

function cv() {
  if (!CA) return;
  const o1 = parseFloat(document.getElementById('o1').value);
  const o2 = parseFloat(document.getElementById('o2').value);
  const res = document.getElementById('vres');
  if (!o1 && !o2) { res.innerHTML = '<div style="color:var(--dim)">Entre les cotes pour détecter les values</div>'; return; }
  const chk = (odds, myp, name, col) => {
    if (!odds || odds < 1) return '';
    const ip = Math.round(100 / odds), edge = myp - ip;
    const c = edge >= 3 ? 'var(--live)' : edge <= -3 ? 'var(--danger)' : 'var(--mid)';
    const lb = edge >= 3 ? '✓ Value bet' : edge <= -3 ? '✗ Pas de value' : '~ Neutre';
    return `<div class="vrow"><div class="vinfo"><strong style="color:${col}">${name}</strong><br>
      Cote ${odds} → proba implicite <strong style="color:var(--white)">${ip}%</strong> · modèle <strong style="color:var(--white)">${myp}%</strong><br>
      <span style="color:${c};font-weight:700;">${lb}</span></div>
      <div class="vedge" style="color:${c}">${edge > 0 ? '+' : ''}${edge}%</div></div>`;
  };
  res.innerHTML = chk(o1, CA.pr.p1, CA.m.p1, 'var(--yellow)') + chk(o2, CA.pr.p2, CA.m.p2, 'var(--accent)');
}

let surfSearchTimer = null;
let cachedPlayers = null;

function rsuf(query = '') {
  const q = query.toLowerCase().trim();

  // Cache la liste des joueurs (calculée une seule fois)
  if (!cachedPlayers) {
    const nameSet = new Set();
    allRows.forEach(r => { if (r.winner_name) nameSet.add(r.winner_name); });
    cachedPlayers = [...nameSet].sort();
  }

  const filtered = q
    ? cachedPlayers.filter(p => p.toLowerCase().includes(q))
    : cachedPlayers;

  const surfaces = ['Clay','Hard','Grass'];
  const cls = v => v >= 75 ? 'color:var(--live)' : v >= 60 ? 'color:var(--yellow)' : 'color:var(--danger)';

  const rows = filtered.map(p => {
    const stats = surfaces.map(s => {
      const st = getStats(p, s);
      return st && st.matches > 2 ? `<td style="font-weight:700;${cls(st.winPct)}">${st.winPct}%<span style="font-size:9px;color:var(--dim);"> (${st.matches})</span></td>` : '<td style="color:var(--dim)">—</td>';
    }).join('');
    const all = getStats(p, 'All');
    const flag = FL[p] || '';
    return `<tr><td>${flag} ${p}</td>${stats}<td style="color:var(--mid)">${all ? all.bpConc : '—'}</td><td style="color:var(--mid)">${all ? all.bpSaved + '%' : '—'}</td></tr>`;
  }).join('');

  const tbody = document.getElementById('surf-table');
  if (tbody) tbody.innerHTML = rows || '<tr><td colspan="6" style="text-align:center;color:var(--dim);padding:1rem;">Aucun joueur trouvé</td></tr>';
}

function rsufDebounced(query) {
  clearTimeout(surfSearchTimer);
  surfSearchTimer = setTimeout(() => rsuf(query), 250);
}

          <th>BP conc.</th><th>BP sauv.</th>
        </tr></thead>
        <tbody id="surf-table"></tbody>
      </table>
    </div>`;
  rsuf();
}

function sw(n) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('on', ['matches','podium','surf'][i] === n));
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));
  document.getElementById('t-'+n).classList.add('on');
  if (n === 'surf') initSurf();
  if (n === 'podium') renderPodium();
}

function renderPodium() {
  const cont = document.getElementById('podium-cont');

  // Calculer les edges pour tous les matchs du jour actif
  const activeBtn = document.querySelector('.day-btn.on');
  const idx = activeBtn ? [...document.querySelectorAll('.day-btn')].indexOf(activeBtn) : 0;
  if (!DAYS[idx]) { cont.innerHTML = '<div class="empty">Aucun match disponible.</div>'; return; }

  const day = DAYS[idx];
  const values = [];

  day.tournaments.forEach(t => {
    t.matches.forEach(m => {
      if (!dataLoaded) return;
      const pr = calcProb(m.p1, m.p2, t.surface);
      const odds = getOdds(m.p1, m.p2);

      // Vérifier les deux joueurs
      [[odds.o1, pr.p1, m.p1, m.p2], [odds.o2, pr.p2, m.p2, m.p1]].forEach(([odd, prob, player, opp]) => {
        if (!odd || !prob) return;
        const impliedProb = 100 / odd;
        const edge = Math.round((prob - impliedProb) * 10) / 10;
        if (edge >= 3) {
          values.push({ edge, odd, prob, player, opp, surface: t.surface, tournament: t.name, flag: t.flag });
        }
      });
    });
  });

  // Trier par edge décroissant
  values.sort((a, b) => b.edge - a.edge);

  const top3 = [values[0] || null, values[1] || null, values[2] || null];
  const dateStr = `${day.label} ${day.num} ${day.mon}`;

  // Positions podium : 2e à gauche, 1er au centre, 3e à droite
  const podiumOrder = [top3[1], top3[0], top3[2]];
  const heights = ['120px', '160px', '90px'];
  const medals = ['🥈', '🥇', '🥉'];
  const ranks = [2, 1, 3];

  const podiumBlocks = podiumOrder.map((v, i) => {
    if (!v) return `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">
        <div style="width:110px;height:${heights[i]};background:var(--bg3);border:1px dashed var(--border);border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:24px;opacity:.3">—</span>
        </div>
        <div style="background:var(--bg3);border:1px solid var(--border);border-top:none;width:110px;padding:6px;text-align:center;border-radius:0 0 4px 4px;">
          <div style="font-size:18px">${medals[i]}</div>
          <div style="font-size:10px;color:var(--dim);">Pas de value</div>
        </div>
      </div>`;

    return `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">
        <div style="background:var(--bg2);border:1px solid rgba(63,200,122,.3);border-radius:10px;padding:10px;text-align:center;margin-bottom:6px;width:130px;">
          <div style="font-size:11px;font-weight:700;color:var(--white);margin-bottom:2px;">${v.player.split(' ')[0]}</div>
          <div style="font-size:10px;color:var(--dim);margin-bottom:6px;">vs ${v.opp.split(' ')[0]}</div>
          <div style="font-size:18px;font-weight:900;color:var(--live);">+${v.edge}%</div>
          <div style="font-size:10px;color:var(--mid);margin-top:2px;">edge</div>
          <div style="display:flex;justify-content:center;gap:6px;margin-top:6px;">
            <span style="font-size:11px;background:rgba(63,200,122,.15);color:var(--live);border:1px solid rgba(63,200,122,.3);border-radius:4px;padding:2px 6px;font-weight:700;">×${v.odd.toFixed(2)}</span>
            <span style="font-size:11px;background:var(--pill);color:var(--mid);border-radius:4px;padding:2px 6px;">${v.prob}%</span>
          </div>
          <div style="font-size:9px;color:var(--dim);margin-top:5px;">${v.flag} ${v.tournament}</div>
        </div>
        <div style="width:130px;height:${heights[i]};background:linear-gradient(180deg, rgba(63,200,122,.15) 0%, rgba(63,200,122,.05) 100%);border:1px solid rgba(63,200,122,.25);border-bottom:none;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:28px;">${medals[i]}</span>
        </div>
        <div style="background:rgba(63,200,122,.1);border:1px solid rgba(63,200,122,.2);border-top:none;width:130px;padding:5px;text-align:center;border-radius:0 0 4px 4px;">
          <div style="font-size:13px;font-weight:900;color:var(--live);">${ranks[i]}${ranks[i]===1?'er':'e'}</div>
        </div>
      </div>`;
  }).join('');

  cont.innerHTML = `
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;">Colligoat présente</div>
      <div style="font-size:18px;font-weight:800;color:var(--white);line-height:1.3;">Le podium du jour 🎾</div>
      <div style="font-size:12px;color:var(--mid);margin-top:4px;">${dateStr} · Top values selon notre modèle</div>
    </div>
    ${values.length === 0 ? `<div class="empty" style="padding:2rem;">
      <div style="font-size:32px;margin-bottom:12px;">😴</div>
      <div style="color:var(--mid);font-weight:600;">Aucune value détectée aujourd'hui</div>
      <div style="color:var(--dim);font-size:12px;margin-top:6px;">Les bookmakers sont bien calibrés sur ces matchs</div>
    </div>` : `
    <div style="display:flex;justify-content:center;align-items:flex-end;gap:8px;padding:0 8px 0;">
      ${podiumBlocks}
    </div>
    <div style="height:4px;background:linear-gradient(90deg,transparent,rgba(63,200,122,.3),transparent);border-radius:2px;margin-top:0;"></div>
    <div style="margin-top:1.25rem;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;">
      <div style="font-size:10px;font-weight:700;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;">Comment lire</div>
      <div style="font-size:11px;color:var(--mid);line-height:1.7;">L'<strong style="color:var(--white);">edge</strong> = probabilité Colligoat − probabilité implicite de la cote. Au dessus de <strong style="color:var(--live);">+3%</strong> c'est une value. Plus l'edge est élevé, meilleure est la value.</div>
    </div>`}`;
}

// ─── INIT DATE NAV ────────────────────────────────────────────────────────────
const nav = document.getElementById('date-nav');
nav.innerHTML = `<div style="font-size:11px;color:var(--dim);padding:8px;">Chargement des matchs...</div>`;
document.getElementById('mlist').innerHTML = '<div class="empty">Chargement des matchs en cours...</div>';

let oddsIndex = {}; // cotes chargées depuis odds.json

// Trouver les cotes d'un match par nom de joueurs
function normName(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // enlever accents
    .replace(/[^a-z\s]/g, '') // garder seulement lettres et espaces
    .trim();
}

function nameSimilarity(a, b) {
  const na = normName(a), nb = normName(b);
  if (na === nb) return 1;
  // Match sur nom de famille (dernier mot)
  const lastA = na.split(' ').pop();
  const lastB = nb.split(' ').pop();
  if (lastA === lastB && lastA.length > 3) return 0.9;
  // Match si l'un contient l'autre
  if (na.includes(nb) || nb.includes(na)) return 0.85;
  // Match sur prénom + début du nom
  const partsA = na.split(' ');
  const partsB = nb.split(' ');
  if (partsA[0] === partsB[0] && partsA.length > 1 && partsB.length > 1) {
    if (partsA[1][0] === partsB[1][0]) return 0.8;
  }
  return 0;
}

function getOdds(p1, p2) {
  let bestMatch = null;
  let bestScore = 0.7; // seuil minimum

  for (const key of Object.keys(oddsIndex)) {
    const parts = key.split('|');
    if (parts.length !== 2) continue;
    const k1 = parts[0], k2 = parts[1];

    // Essayer les deux ordres
    const score1 = Math.min(nameSimilarity(p1, k1), nameSimilarity(p2, k2));
    const score2 = Math.min(nameSimilarity(p1, k2), nameSimilarity(p2, k1));

    if (score1 > bestScore) {
      bestScore = score1;
      bestMatch = {o1: oddsIndex[key].p1, o2: oddsIndex[key].p2, matched: true};
    }
    if (score2 > bestScore) {
      bestScore = score2;
      bestMatch = {o1: oddsIndex[key].p2, o2: oddsIndex[key].p1, matched: true};
    }
  }

  return bestMatch || {o1: null, o2: null, matched: false};
}

// Calcule si une cote est une value
function oddsChip(odds, myProb) {
  if (!odds) return `<span class="odd-chip odd-none">—</span>`;
  const impliedProb = 100 / odds;
  const edge = myProb - impliedProb;
  const cls = edge >= 3 ? 'odd-value' : edge <= -3 ? 'odd-novalue' : 'odd-neutral';
  return `<span class="odd-chip ${cls}">${odds.toFixed(2)}</span>`;
}

// ─── LOAD CSV DATA + MATCHES JSON + ODDS ────────────────────────────────────
async function loadData() {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');

  // 1. Charger matches.json
  try {
    const res = await fetch('./matches.json');
    if (res.ok) {
      const data = await res.json();
      DAYS = parseMatchesJSON(data);
      if (DAYS.length > 0) {
        const nav = document.getElementById('date-nav');
        nav.innerHTML = DAYS.map((d, i) => {
          const nb = d.tournaments.reduce((acc, t) => acc + t.matches.length, 0);
          return `<button class="day-btn ${i===0?'on':''}" onclick="renderDay(${i})">
            <span class="dday">${d.isTbc ? '🕐' : d.label}</span>
            <span class="dnum" style="${d.isTbc ? 'font-size:13px;' : ''}">${d.isTbc ? 'TBC' : d.num}</span>
            <span class="dmon">${d.isTbc ? '' : d.mon}</span>
            <span class="dnb">${nb} match${nb>1?'s':''}</span>
          </button>`;
        }).join('');
        renderDay(0);
      }
    }
  } catch(e) {
    console.log('matches.json non disponible');
  }

  // 2. Charger odds.json
  try {
    const res = await fetch('./odds.json');
    if (res.ok) {
      oddsIndex = await res.json();
      console.log('Odds loaded:', Object.keys(oddsIndex).length, 'matches');
      // Re-render pour afficher les cotes
      const activeBtn = document.querySelector('.day-btn.on');
      const idx = activeBtn ? [...document.querySelectorAll('.day-btn')].indexOf(activeBtn) : 0;
      if (DAYS.length > 0) renderDay(idx);
    }
  } catch(e) {
    console.log('odds.json non disponible');
  }

  // 3. Charger les CSV Sackmann
  try {
    const results = await Promise.allSettled(
      CSV_FILES.map(f => fetch(f.url).then(r => r.ok ? r.text() : Promise.reject(r.status)))
    );

    let loaded = 0;
    results.forEach((res, i) => {
      if (res.status === 'fulfilled') {
        const rows = parseCSV(res.value);
        allRows = allRows.concat(rows);
        loaded++;
        txt.textContent = `Chargement... ${loaded}/${CSV_FILES.length} fichiers`;
      }
    });

    if (allRows.length > 0) {
      dataLoaded = true;
      dot.className = 'status-dot ok';
      txt.textContent = `${allRows.length.toLocaleString()} matchs · Tennis Abstract`;
      const activeBtn = document.querySelector('.day-btn.on');
      const idx = activeBtn ? [...document.querySelectorAll('.day-btn')].indexOf(activeBtn) : 0;
      if (DAYS.length > 0) renderDay(idx);
    } else {
      throw new Error('Aucune donnée chargée');
    }
  } catch(e) {
    dot.className = 'status-dot error';
    txt.textContent = 'Données simulées (fichiers CSV introuvables)';
    dataLoaded = false;
  }
}

loadData();
</script>
