name: Update Tennis Matches

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch matches from RapidAPI
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          const today = new Date();
          const endDate = new Date(today);
          endDate.setDate(endDate.getDate() + 6);
          const fmt = d => d.toISOString().slice(0,10);
          const startStr = fmt(today);
          const endStr = fmt(endDate);

          function apiGet(path) {
            return new Promise((resolve) => {
              const options = {
                method: 'GET',
                hostname: 'tennis-api-atp-wta-itf.p.rapidapi.com',
                path,
                headers: {
                  'X-RapidAPI-Key': process.env.RAPIDAPI_KEY,
                  'X-RapidAPI-Host': 'tennis-api-atp-wta-itf.p.rapidapi.com'
                }
              };
              const req = https.request(options, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { resolve({}); }
                });
              });
              req.on('error', () => resolve({}));
              req.end();
            });
          }

          async function main() {
            const allMatches = {};

            // 1. Récupérer fixtures ATP et WTA
            const [atpData, wtaData] = await Promise.all([
              apiGet('/tennis/v2/atp/fixtures/' + startStr + '/' + endStr),
              new Promise(r => setTimeout(r, 1500)).then(() =>
                apiGet('/tennis/v2/wta/fixtures/' + startStr + '/' + endStr)
              )
            ]);

            // Combiner ATP + WTA
            const allFixtures = [
              ...(atpData.data || []).map(m => ({...m, tour:'atp'})),
              ...(wtaData.data || []).map(m => ({...m, tour:'wta'})),
            ];

            console.log('Total fixtures:', allFixtures.length);

            // Grouper par date
            allFixtures.forEach(m => {
              const date = (m.date || startStr).slice(0,10);
              if (!allMatches[date]) allMatches[date] = {data: []};
              allMatches[date].data.push(m);
            });

            // 2. Récupérer les noms des tournois uniques
            const tournIds = [...new Set(allFixtures.map(m => m.tournamentId).filter(Boolean))];
            console.log('Unique tournament IDs:', tournIds);

            const tournNames = {};
            for (let i = 0; i < tournIds.length; i++) {
              const id = tournIds[i];
              // Alterner atp/wta pour trouver le bon endpoint
              const atpInfo = await apiGet('/tennis/v2/atp/tournament/info/' + id);
              if (atpInfo.data?.name) {
                tournNames[id] = {
                  name: atpInfo.data.name,
                  surface: atpInfo.data.surface || 'Clay',
                  country: atpInfo.data.country || '',
                  countryAcr: atpInfo.data.countryAcr || '',
                };
                console.log('Tournament', id, ':', atpInfo.data.name);
              } else {
                const wtaInfo = await apiGet('/tennis/v2/wta/tournament/info/' + id);
                if (wtaInfo.data?.name) {
                  tournNames[id] = {
                    name: wtaInfo.data.name,
                    surface: wtaInfo.data.surface || 'Clay',
                    country: wtaInfo.data.country || '',
                    countryAcr: wtaInfo.data.countryAcr || '',
                  };
                  console.log('Tournament', id, '(wta):', wtaInfo.data.name);
                }
              }
              // Pause entre chaque requête
              if (i < tournIds.length - 1) await new Promise(r => setTimeout(r, 800));
            }

            // 3. Enrichir les matchs avec les noms de tournois
            Object.keys(allMatches).forEach(date => {
              allMatches[date].data = allMatches[date].data.map(m => ({
                ...m,
                tournament: tournNames[m.tournamentId] || {name: 'Tournoi ' + m.tournamentId, surface: 'Clay'}
              }));
            });

            fs.writeFileSync('matches.json', JSON.stringify(allMatches, null, 2));
            console.log('Done! matches.json updated');
          }

          main().catch(console.error);
          "

      - name: Commit matches.json
        run: |
          git config user.name "ColliGoat Bot"
          git config user.email "bot@colligoat.com"
          git add matches.json
          git diff --staged --quiet || git commit -m "Update matches $(date +%Y-%m-%d)"
          git push
