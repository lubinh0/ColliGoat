name: Update Tennis Matches

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch matches from RapidAPI
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function apiGet(path) {
            return new Promise((resolve) => {
              const options = {
                method: 'GET',
                hostname: 'tennis-api-atp-wta-itf.p.rapidapi.com',
                path,
                headers: {
                  'X-RapidAPI-Key': process.env.RAPIDAPI_KEY,
                  'X-RapidAPI-Host': 'tennis-api-atp-wta-itf.p.rapidapi.com'
                }
              };
              const req = https.request(options, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { resolve({}); }
                });
              });
              req.on('error', () => resolve({}));
              req.end();
            });
          }

          async function main() {
            const today = new Date();
            const endDate = new Date(today);
            endDate.setDate(endDate.getDate() + 7);
            const fmt = d => d.toISOString().slice(0,10);
            const startStr = fmt(today);
            const endStr = fmt(endDate);

            console.log('Fetching from', startStr, 'to', endStr);

            // 1. Récupérer fixtures ATP et WTA
            const [atpData, wtaData] = await Promise.all([
              apiGet('/tennis/v2/atp/fixtures/' + startStr + '/' + endStr),
              sleep(1200).then(() => apiGet('/tennis/v2/wta/fixtures/' + startStr + '/' + endStr))
            ]);

            const atpFixtures = (atpData.data || []).map(m => ({...m, tour:'atp'}));
            const wtaFixtures = (wtaData.data || []).map(m => ({...m, tour:'wta'}));
            const allFixtures = [...atpFixtures, ...wtaFixtures];

            console.log('ATP fixtures:', atpFixtures.length);
            console.log('WTA fixtures:', wtaFixtures.length);

            // Filtrer les doubles
            const singles = allFixtures.filter(m => {
              const p1 = m.player1?.name || '';
              const p2 = m.player2?.name || '';
              return !p1.includes('/') && !p2.includes('/');
            });

            console.log('Singles:', singles.length);

            // 2. Récupérer les noms des tournois uniques
            const tournIds = [...new Set(singles.map(m => m.tournamentId).filter(Boolean))];
            console.log('Tournament IDs:', tournIds);

            const tournInfo = {};
            for (let i = 0; i < tournIds.length; i++) {
              const id = tournIds[i];
              // Trouver le tour de ce tournoi
              const sample = singles.find(m => m.tournamentId === id);
              const tour = sample?.tour || 'atp';

              const res = await apiGet('/tennis/v2/' + tour + '/tournament/info/' + id);
              if (res.data) {
                tournInfo[id] = {
                  name: res.data.name || 'Tournoi ' + id,
                  surface: res.data.court?.name || res.data.surface || 'Clay',
                  countryAcr: res.data.country?.acronym || res.data.countryAcr || ''
                };
                console.log('Tournament', id, ':', tournInfo[id].name);
              } else {
                tournInfo[id] = {name: 'Tournoi ' + id, surface: 'Clay', countryAcr: ''};
              }
              if (i < tournIds.length - 1) await sleep(800);
            }

            // Drapeaux pays
            const FLAGS = {
              'FRA':'🇫🇷','ESP':'🇪🇸','ITA':'🇮🇹','GER':'🇩🇪','USA':'🇺🇸',
              'GBR':'🇬🇧','SUI':'🇨🇭','AUS':'🇦🇺','ARG':'🇦🇷','RUS':'🇷🇺',
              'POL':'🇵🇱','BLR':'🇧🇾','GRE':'🇬🇷','CAN':'🇨🇦','JPN':'🇯🇵',
              'BEL':'🇧🇪','SWE':'🇸🇪','DEN':'🇩🇰','NED':'🇳🇱','CZE':'🇨🇿',
              'AUT':'🇦🇹','POR':'🇵🇹','MCO':'🇲🇨','SRB':'🇷🇸','CRO':'🇭🇷',
            };

            // 3. Grouper par date
            const allMatches = {};
            singles.forEach(m => {
              if (!m.date) return;
              const date = m.date.slice(0,10);
              if (!allMatches[date]) allMatches[date] = {data: []};

              const tInfo = tournInfo[m.tournamentId] || {name: 'Tournoi ' + m.tournamentId, surface: 'Clay', countryAcr: ''};
              const flag = FLAGS[tInfo.countryAcr] || '🎾';

              allMatches[date].data.push({
                ...m,
                tournament: {
                  name: tInfo.name,
                  surface: tInfo.surface,
                  flag
                }
              });
            });

            let total = 0;
            Object.keys(allMatches).sort().forEach(d => {
              const n = allMatches[d].data.length;
              total += n;
              console.log(d, ':', n, 'matches');
            });
            console.log('Total:', total);

            fs.writeFileSync('matches.json', JSON.stringify(allMatches, null, 2));
            console.log('Done!');
          }

          main().catch(console.error);
          "

      - name: Commit matches.json
        run: |
          git config user.name "ColliGoat Bot"
          git config user.email "bot@colligoat.com"
          git add matches.json
          git diff --staged --quiet || git commit -m "Update matches $(date +%Y-%m-%d)"
          git push
