name: Update Tennis Matches

on:
  schedule:
    - cron: '0 4 * * *'   # 6h FR
    - cron: '0 7 * * *'   # 9h FR
    - cron: '0 10 * * *'  # 12h FR
    - cron: '0 16 * * *'  # 18h FR
  workflow_dispatch:

jobs:
  fetch-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch matches, odds and results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function apiGet(path) {
            return new Promise((resolve) => {
              const options = {
                method: 'GET',
                hostname: 'api.the-odds-api.com',
                path,
                headers: {}
              };
              const req = https.request(options, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { resolve([]); }
                });
              });
              req.on('error', () => resolve([]));
              req.end();
            });
          }

          function getSurface(sport, tournName) {
            const n = (tournName || sport || '').toLowerCase();
            if (n.includes('french') || n.includes('roland') || n.includes('hamburg') ||
                n.includes('madrid') || n.includes('rome') || n.includes('barcelona') ||
                n.includes('monte') || n.includes('geneva') || n.includes('strasbourg') ||
                n.includes('rabat') || n.includes('lyon')) return 'Clay';
            if (n.includes('wimbledon') || n.includes('halle') || n.includes('queens') ||
                n.includes('eastbourne') || n.includes('birmingham')) return 'Grass';
            return 'Hard';
          }

          function getFlag(tournName) {
            const n = (tournName || '').toLowerCase();
            if (n.includes('french') || n.includes('paris') || n.includes('roland') || n.includes('strasbourg') || n.includes('lyon')) return 'FR';
            if (n.includes('wimbledon') || n.includes('london') || n.includes('queens') || n.includes('eastbourne') || n.includes('birmingham')) return 'GB';
            if (n.includes('hamburg')) return 'DE';
            if (n.includes('halle')) return 'DE';
            if (n.includes('madrid')) return 'ES';
            if (n.includes('rome') || n.includes('italia')) return 'IT';
            if (n.includes('monte') || n.includes('monaco')) return 'MC';
            if (n.includes('geneva')) return 'CH';
            if (n.includes('rabat')) return 'MA';
            if (n.includes('us open') || n.includes('new york') || n.includes('cincinnati') || n.includes('toronto') || n.includes('montreal')) return 'US';
            if (n.includes('australian') || n.includes('melbourne')) return 'AU';
            if (n.includes('miami')) return 'US';
            if (n.includes('beijing') || n.includes('china') || n.includes('wuhan')) return 'CN';
            if (n.includes('tokyo') || n.includes('japan')) return 'JP';
            if (n.includes('dubai') || n.includes('abu dhabi')) return 'AE';
            if (n.includes('doha')) return 'QA';
            if (n.includes('acapulco') || n.includes('mexican')) return 'MX';
            if (n.includes('buenos') || n.includes('argentina')) return 'AR';
            if (n.includes('rio') || n.includes('brazil')) return 'BR';
            if (n.includes('eastbourne') || n.includes('nottingham')) return 'GB';
            return 'UN';
          }

          async function getActiveSports() {
            const all = await apiGet('/v4/sports/?apiKey=' + process.env.ODDS_API_KEY);
            return (Array.isArray(all) ? all : [])
              .filter(s => s.group === 'Tennis' && s.active)
              .map(s => s.key);
          }

          async function main() {
            const today = new Date();
            // Correction fuseau : on considère la date en heure française (UTC+2)
            const todayFR = new Date(today.getTime() + 2 * 60 * 60 * 1000);
            const todayStr = todayFR.toISOString().slice(0,10);
            const j3 = new Date(todayFR); j3.setDate(j3.getDate() + 3);
            const j3Str = j3.toISOString().slice(0,10);

            console.log('Window:', todayStr, 'to', j3Str);
            const sports = await getActiveSports();
            console.log('Active sports:', sports.length);

            const allMatches = {};
            const oddsIndex = {};

            for (let i = 0; i < sports.length; i++) {
              const sport = sports[i];
              await sleep(300);
              const events = await apiGet(
                '/v4/sports/' + sport + '/odds/?apiKey=' + process.env.ODDS_API_KEY +
                '&regions=eu&markets=h2h&oddsFormat=decimal&bookmakers=betclic,unibet,winamax,bet365,pinnacle'
              );
              if (!Array.isArray(events) || !events.length) { console.log(sport, ': no data'); continue; }
              console.log(sport, ':', events.length, 'events');

              events.forEach(event => {
                if (!event.commence_time) return;
                // Convertir en heure française pour la date
                const eventDateFR = new Date(new Date(event.commence_time).getTime() + 2 * 60 * 60 * 1000);
                const date = eventDateFR.toISOString().slice(0,10);

                // Garder uniquement aujourd'hui + J+3
                if (date < todayStr || date > j3Str) return;

                const p1 = event.home_team || '', p2 = event.away_team || '';
                if (!p1 || !p2) return;
                const tournName = event.sport_title || sport;
                const surface = getSurface(sport, tournName);
                const flag = getFlag(tournName);

                // Heure en français
                const d = new Date(event.commence_time);
                const hFR = (d.getUTCHours() + 2) % 24;
                const timeStr = String(hFR).padStart(2,'0') + 'h' + String(d.getUTCMinutes()).padStart(2,'0');

                if (!allMatches[date]) allMatches[date] = {data: []};

                // Éviter les doublons
                const exists = allMatches[date].data.find(m =>
                  m.player1.name === p1 && m.player2.name === p2
                );
                if (!exists) {
                  allMatches[date].data.push({
                    id: event.id, date: event.commence_time,
                    player1: {name: p1}, player2: {name: p2},
                    tour: sport.includes('wta') ? 'wta' : 'atp',
                    time: timeStr, scheduled: true,
                    tournament: {name: tournName, surface, flag}
                  });
                }

                // Meilleures cotes
                const bookmakers = event.bookmakers || [];
                const bestOdds = {p1: null, p2: null, p1name: p1, p2name: p2};
                bookmakers.forEach(bk => {
                  const market = (bk.markets || []).find(m => m.key === 'h2h');
                  if (!market) return;
                  const outcomes = market.outcomes || [];
                  const o1 = outcomes.find(o => o.name === p1);
                  const o2 = outcomes.find(o => o.name === p2);
                  if (o1 && (!bestOdds.p1 || o1.price > bestOdds.p1)) bestOdds.p1 = o1.price;
                  if (o2 && (!bestOdds.p2 || o2.price > bestOdds.p2)) bestOdds.p2 = o2.price;
                });

                if (bestOdds.p1 && bestOdds.p2) {
                  const key = [p1, p2].sort().join('|').toLowerCase();
                  oddsIndex[key] = bestOdds;
                }
              });
            }

            // Trier les matchs par heure dans chaque jour
            Object.keys(allMatches).forEach(date => {
              allMatches[date].data.sort((a, b) => a.time.localeCompare(b.time));
            });

            let total = 0;
            Object.keys(allMatches).sort().forEach(d => {
              const n = allMatches[d].data.length;
              total += n;
              console.log(d, ':', n, 'matches');
            });
            console.log('Total:', total);

            fs.writeFileSync('matches.json', JSON.stringify(allMatches, null, 2));
            fs.writeFileSync('odds.json', JSON.stringify(oddsIndex, null, 2));
            console.log('Done!');
          }

          main().catch(console.error);
          "

      - name: Commit files
        run: |
          git config user.name "ColliGoat Bot"
          git config user.email "bot@colligoat.com"
          git add matches.json odds.json
          git diff --staged --quiet || git commit -m "Update matches and odds $(date +%Y-%m-%d %H:%M)"
          git pull --rebase origin main
          git push
