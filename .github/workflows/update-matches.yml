name: Update Tennis Matches

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch matches from RapidAPI
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function apiGet(path) {
            return new Promise((resolve) => {
              const options = {
                method: 'GET',
                hostname: 'tennis-api-atp-wta-itf.p.rapidapi.com',
                path,
                headers: {
                  'X-RapidAPI-Key': process.env.RAPIDAPI_KEY,
                  'X-RapidAPI-Host': 'tennis-api-atp-wta-itf.p.rapidapi.com'
                }
              };
              const req = https.request(options, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { resolve({}); }
                });
              });
              req.on('error', () => resolve({}));
              req.end();
            });
          }

          // Tournois hardcodés — IDs connus
          const TOURNAMENTS = [
            // ATP
            {id: 21327, tour: 'atp', name: 'Roland Garros', surface: 'Clay', flag: '🇫🇷'},
            {id: 21328, tour: 'atp', name: 'Wimbledon', surface: 'Grass', flag: '🇬🇧'},
            {id: 21329, tour: 'atp', name: 'US Open', surface: 'Hard', flag: '🇺🇸'},
            {id: 21330, tour: 'atp', name: 'Australian Open', surface: 'Hard', flag: '🇦🇺'},
            {id: 21331, tour: 'atp', name: 'ATP Genève', surface: 'Clay', flag: '🇨🇭'},
            {id: 21332, tour: 'atp', name: 'ATP Lyon', surface: 'Clay', flag: '🇫🇷'},
            {id: 21333, tour: 'atp', name: 'ATP Rome', surface: 'Clay', flag: '🇮🇹'},
            {id: 21334, tour: 'atp', name: 'ATP Madrid', surface: 'Clay', flag: '🇪🇸'},
            {id: 21335, tour: 'atp', name: 'ATP Barcelona', surface: 'Clay', flag: '🇪🇸'},
            {id: 21336, tour: 'atp', name: 'ATP Monte Carlo', surface: 'Clay', flag: '🇲🇨'},
            // WTA
            {id: 21337, tour: 'wta', name: 'Roland Garros', surface: 'Clay', flag: '🇫🇷'},
            {id: 21338, tour: 'wta', name: 'WTA Strasbourg', surface: 'Clay', flag: '🇫🇷'},
            {id: 21339, tour: 'wta', name: 'WTA Rome', surface: 'Clay', flag: '🇮🇹'},
            {id: 21340, tour: 'wta', name: 'WTA Madrid', surface: 'Clay', flag: '🇪🇸'},
          ];

          async function getTournamentMatches(tournamentId, tour) {
            let page = 1;
            let allMatches = [];
            let hasNext = true;

            while (hasNext && page <= 10) {
              const res = await apiGet('/tennis/v2/' + tour + '/tournament/fixtures/' + tournamentId + '?page=' + page);
              const matches = res.data || [];
              if (matches.length === 0) break;
              allMatches = allMatches.concat(matches);
              hasNext = res.hasNextPage === true;
              page++;
              if (hasNext) await sleep(500);
            }

            // Filtrer les doubles
            return allMatches.filter(m => {
              const p1 = m.player1?.name || '';
              const p2 = m.player2?.name || '';
              return !p1.includes('/') && !p2.includes('/') && p1 !== '?' && p2 !== '?';
            });
          }

          async function main() {
            const today = new Date();
            const endDate = new Date(today);
            endDate.setDate(endDate.getDate() + 7);
            const fmt = d => d.toISOString().slice(0,10);
            const startStr = fmt(today);
            const endStr = fmt(endDate);

            console.log('Window:', startStr, 'to', endStr);

            const allMatches = {};
            let totalMatches = 0;

            for (let i = 0; i < TOURNAMENTS.length; i++) {
              const t = TOURNAMENTS[i];
              console.log('Fetching', t.name, '(' + t.tour + ') id=' + t.id);

              const matches = await getTournamentMatches(t.id, t.tour);
              
              // Filtrer par fenêtre de dates
              const filtered = matches.filter(m => {
                if (!m.date) return false;
                const date = m.date.slice(0,10);
                return date >= startStr && date <= endStr;
              });

              console.log(' -> total:', matches.length, '| in window:', filtered.length);

              filtered.forEach(m => {
                const date = m.date.slice(0,10);
                if (!allMatches[date]) allMatches[date] = {data: []};
                allMatches[date].data.push({
                  ...m,
                  tour: t.tour,
                  tournament: {
                    name: t.name,
                    surface: t.surface,
                    flag: t.flag
                  }
                });
                totalMatches++;
              });

              if (i < TOURNAMENTS.length - 1) await sleep(700);
            }

            console.log('Total matches in window:', totalMatches);
            Object.keys(allMatches).sort().forEach(d => {
              console.log(d, ':', allMatches[d].data.length, 'matches');
            });

            fs.writeFileSync('matches.json', JSON.stringify(allMatches, null, 2));
            console.log('Done!');
          }

          main().catch(console.error);
          "

      - name: Commit matches.json
        run: |
          git config user.name "ColliGoat Bot"
          git config user.email "bot@colligoat.com"
          git add matches.json
          git diff --staged --quiet || git commit -m "Update matches $(date +%Y-%m-%d)"
          git push
