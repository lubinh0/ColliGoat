name: Update Tennis Matches

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch matches and odds
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function apiGet(hostname, path) {
            return new Promise((resolve) => {
              const options = {
                method: 'GET',
                hostname,
                path,
                headers: hostname.includes('rapidapi') ? {
                  'X-RapidAPI-Key': process.env.RAPIDAPI_KEY,
                  'X-RapidAPI-Host': 'tennis-api-atp-wta-itf.p.rapidapi.com'
                } : {}
              };
              const req = https.request(options, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { resolve({}); }
                });
              });
              req.on('error', () => resolve({}));
              req.end();
            });
          }

          // Récupère tous les matchs d'un tournoi avec pagination
          async function getTournamentMatches(id, tour) {
            // Essayer d'abord avec le tour indiqué, puis l'autre
            const tours = tour === 'atp' ? ['atp', 'wta'] : ['wta', 'atp'];
            for (const t of tours) {
              let page = 1, all = [], hasNext = true;
              while (hasNext && page <= 5) {
                const res = await apiGet('tennis-api-atp-wta-itf.p.rapidapi.com', '/tennis/v2/' + t + '/tournament/fixtures/' + id + '?page=' + page);
                const matches = res.data || [];
                if (!matches.length) break;
                all = all.concat(matches.map(m => ({...m, tour: t})));
                hasNext = res.hasNextPage === true;
                page++;
                if (hasNext) await sleep(500);
              }
              if (all.length > 0) {
                return all.filter(m => {
                  const p1 = m.player1?.name || '';
                  const p2 = m.player2?.name || '';
                  return !p1.includes('/') && !p2.includes('/') && p1 && p2;
                });
              }
            }
            return [];
          }

          async function main() {
            const today = new Date();
            const endDate = new Date(today);
            endDate.setDate(endDate.getDate() + 14);
            const fmt = d => d.toISOString().slice(0,10);
            const startStr = fmt(today);
            const endStr = fmt(endDate);

            console.log('Fetching from', startStr, 'to', endStr);

            // 1. Fixtures par date (matchs avec horaire confirmé)
            const [atpData, wtaData] = await Promise.all([
              apiGet('tennis-api-atp-wta-itf.p.rapidapi.com', '/tennis/v2/atp/fixtures/' + startStr + '/' + endStr),
              sleep(1200).then(() => apiGet('tennis-api-atp-wta-itf.p.rapidapi.com', '/tennis/v2/wta/fixtures/' + startStr + '/' + endStr))
            ]);

            const scheduledFixtures = [
              ...(atpData.data || []).map(m => ({...m, tour:'atp', scheduled: true})),
              ...(wtaData.data || []).map(m => ({...m, tour:'wta', scheduled: true}))
            ].filter(m => {
              const p1 = m.player1?.name || '';
              const p2 = m.player2?.name || '';
              if (p1.includes('/') || p2.includes('/')) return false;
              // Filtrer les tournois ITF (M15, M25, W15, W25, W35, W50, W60, W100)
              const tId = String(m.tournamentId || '');
              return true; // on filtre par nom de tournoi plus bas
            });

            console.log('Scheduled singles:', scheduledFixtures.length);

            // 2. Récupérer les IDs des tournois actifs
            const tournIds = [...new Set(scheduledFixtures.map(m => ({id: m.tournamentId, tour: m.tour}))
              .filter(t => t.id)
              .map(t => JSON.stringify(t)))].map(t => JSON.parse(t));

            console.log('Active tournaments:', tournIds.length);

            // 3. Infos des tournois
            const tournInfo = {};
            const FLAGS = {
              'FRA':'🇫🇷','ESP':'🇪🇸','ITA':'🇮🇹','GER':'🇩🇪','USA':'🇺🇸',
              'GBR':'🇬🇧','SUI':'🇨🇭','AUS':'🇦🇺','ARG':'🇦🇷','RUS':'🇷🇺',
              'POL':'🇵🇱','BLR':'🇧🇾','GRE':'🇬🇷','CAN':'🇨🇦','MCO':'🇲🇨',
              'SRB':'🇷🇸','CRO':'🇭🇷','BEL':'🇧🇪','SWE':'🇸🇪','NED':'🇳🇱',
              'MAR':'🇲🇦','KOR':'🇰🇷','JPN':'🇯🇵','CHN':'🇨🇳','BRA':'🇧🇷',
            };

            for (let i = 0; i < tournIds.length; i++) {
              const {id, tour} = tournIds[i];
              const res = await apiGet('tennis-api-atp-wta-itf.p.rapidapi.com', '/tennis/v2/' + tour + '/tournament/info/' + id);
              if (res.data) {
                tournInfo[id] = {
                  name: res.data.name || 'Tournoi ' + id,
                  surface: res.data.court?.name || 'Clay',
                  countryAcr: res.data.country?.acronym || '',
                  tour
                };
                console.log('Tournament', id, ':', tournInfo[id].name);
              } else {
                tournInfo[id] = {name: 'Tournoi ' + id, surface: 'Clay', countryAcr: '', tour};
              }
              if (i < tournIds.length - 1) await sleep(800);
            }

            // Filtrer les tournois ITF
            const ITF_KEYWORDS = ['M15','M25','W15','W25','W35','W50','W60','W80','W100','ITF'];
            const filteredTournIds = tournIds.filter(({id}) => {
              const info = tournInfo[id];
              if (!info) return false;
              const name = info.name.toUpperCase();
              return !ITF_KEYWORDS.some(kw => name.includes(kw));
            });

            console.log('Filtered tournaments (no ITF):', filteredTournIds.length);

            // Filtrer les fixtures pour exclure les tournois ITF
            const ITF_IDS = new Set(tournIds.filter(({id}) => {
              const info = tournInfo[id];
              if (!info) return false;
              const name = info.name.toUpperCase();
              return ['M15','M25','W15','W25','W35','W50','W60','W80','W100','ITF'].some(kw => name.includes(kw));
            }).map(({id}) => id));

            const filteredFixtures = scheduledFixtures.filter(m => !ITF_IDS.has(m.tournamentId));
            console.log('Filtered scheduled singles:', filteredFixtures.length);
            for (let i = 0; i < filteredTournIds.length; i++) {
              const {id, tour} = filteredTournIds[i];
              await sleep(600);
              const matches = await getTournamentMatches(id, tour);
              console.log('Tournament', id, ': all matches =', matches.length);
              allTournMatches[id] = matches;
            }

            // 5. Construire le matches.json
            // D'abord indexer les matchs programmés par ID
            const scheduledIds = new Set(filteredFixtures.map(m => m.id));

            const allMatches = {};

            // Ajouter les matchs programmés avec leur date
            filteredFixtures.forEach(m => {
              if (!m.date) return;
              const date = m.date.slice(0,10);
              if (date < startStr || date > endStr) return;
              if (!allMatches[date]) allMatches[date] = {data: []};
              const tInfo = tournInfo[m.tournamentId] || {name: 'Tournoi ' + m.tournamentId, surface: 'Clay', countryAcr: ''};
              allMatches[date].data.push({
                ...m,
                scheduled: true,
                tournament: {name: tInfo.name, surface: tInfo.surface, flag: FLAGS[tInfo.countryAcr] || '🎾'}
              });
            });

            // Ajouter les matchs sans horaire sous une clé spéciale "tbc"
            Object.entries(allTournMatches).forEach(([id, matches]) => {
              const tInfo = tournInfo[id] || {name: 'Tournoi ' + id, surface: 'Clay', countryAcr: ''};
              matches.forEach(m => {
                // Skip si déjà dans les matchs programmés
                if (scheduledIds.has(m.id)) return;
                // Skip si a une date hors fenêtre
                if (m.date) {
                  const date = m.date.slice(0,10);
                  if (date < startStr || date > endStr) return;
                  if (!allMatches[date]) allMatches[date] = {data: []};
                  allMatches[date].data.push({
                    ...m,
                    scheduled: true,
                    tournament: {name: tInfo.name, surface: tInfo.surface, flag: FLAGS[tInfo.countryAcr] || '🎾'}
                  });
                } else {
                  // Pas de date — ajouter sous "tbc"
                  if (!allMatches['tbc']) allMatches['tbc'] = {data: []};
                  allMatches['tbc'].data.push({
                    ...m,
                    scheduled: false,
                    tournament: {name: tInfo.name, surface: tInfo.surface, flag: FLAGS[tInfo.countryAcr] || '🎾'}
                  });
                }
              });
            });

            // Stats
            let total = 0;
            Object.keys(allMatches).sort().forEach(d => {
              const n = allMatches[d].data.length;
              total += n;
              console.log(d, ':', n, 'matches');
            });
            console.log('Total:', total);

            fs.writeFileSync('matches.json', JSON.stringify(allMatches, null, 2));
            console.log('matches.json done');

            // 6. Cotes via The Odds API
            const tennisSports = [
              'tennis_atp_french_open',
              'tennis_wta_french_open',
              'tennis_atp_hamburg_open',
              'tennis_wta_strasbourg',
              'tennis_atp_geneva',
              'tennis_wta_rabat',
            ];

            let allOdds = [];
            for (let i = 0; i < tennisSports.length; i++) {
              await sleep(300);
              const sport = tennisSports[i];
              const res = await apiGet(
                'api.the-odds-api.com',
                '/v4/sports/' + sport + '/odds/?apiKey=' + process.env.ODDS_API_KEY + '&regions=eu&markets=h2h&oddsFormat=decimal&bookmakers=betclic,unibet,winamax,bet365,pinnacle'
              );
              if (Array.isArray(res)) {
                console.log(sport, ':', res.length, 'odds');
                allOdds = allOdds.concat(res);
              } else {
                console.log(sport, ': no data');
              }
            }

            const oddsIndex = {};
            allOdds.forEach(event => {
              const bookmakers = event.bookmakers || [];
              const bestOdds = {p1: null, p2: null, p1name: '', p2name: ''};
              bookmakers.forEach(bk => {
                const market = (bk.markets || []).find(m => m.key === 'h2h');
                if (!market) return;
                const outcomes = market.outcomes || [];
                if (outcomes.length < 2) return;
                const o1 = outcomes[0], o2 = outcomes[1];
                if (!bestOdds.p1 || o1.price > bestOdds.p1) { bestOdds.p1 = o1.price; bestOdds.p1name = o1.name; }
                if (!bestOdds.p2 || o2.price > bestOdds.p2) { bestOdds.p2 = o2.price; bestOdds.p2name = o2.name; }
              });
              if (bestOdds.p1 && bestOdds.p2) {
                const key = [bestOdds.p1name, bestOdds.p2name].sort().join('|').toLowerCase();
                oddsIndex[key] = bestOdds;
              }
            });

            console.log('Odds index size:', Object.keys(oddsIndex).length);
            fs.writeFileSync('odds.json', JSON.stringify(oddsIndex, null, 2));
            console.log('odds.json done!');
          }

          main().catch(console.error);
          "

      - name: Commit files
        run: |
          git config user.name "ColliGoat Bot"
          git config user.email "bot@colligoat.com"
          git add matches.json odds.json
          git diff --staged --quiet || git commit -m "Update matches and odds $(date +%Y-%m-%d)"
          git push
