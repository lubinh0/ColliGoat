name: Update Tennis Matches

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch matches, odds and results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function apiGet(path) {
            return new Promise((resolve) => {
              const options = {
                method: 'GET',
                hostname: 'api.the-odds-api.com',
                path,
                headers: {}
              };
              const req = https.request(options, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { resolve([]); }
                });
              });
              req.on('error', () => resolve([]));
              req.end();
            });
          }

          function getSurface(sport, tournName) {
            const n = (tournName || sport || '').toLowerCase();
            if (n.includes('french') || n.includes('roland') || n.includes('hamburg') ||
                n.includes('madrid') || n.includes('rome') || n.includes('barcelona') ||
                n.includes('monte') || n.includes('geneva') || n.includes('strasbourg') ||
                n.includes('rabat') || n.includes('lyon')) return 'Clay';
            if (n.includes('wimbledon') || n.includes('halle') || n.includes('queens') ||
                n.includes('eastbourne') || n.includes('birmingham')) return 'Grass';
            return 'Hard';
          }

          function getFlag(tournName) {
            const n = (tournName || '').toLowerCase();
            if (n.includes('french') || n.includes('paris') || n.includes('roland') || n.includes('strasbourg') || n.includes('lyon')) return '🇫🇷';
            if (n.includes('wimbledon') || n.includes('london') || n.includes('queens') || n.includes('eastbourne') || n.includes('birmingham')) return '🇬🇧';
            if (n.includes('hamburg')) return '🇩🇪';
            if (n.includes('madrid')) return '🇪🇸';
            if (n.includes('rome') || n.includes('italia')) return '🇮🇹';
            if (n.includes('monte') || n.includes('monaco')) return '🇲🇨';
            if (n.includes('geneva')) return '🇨🇭';
            if (n.includes('rabat')) return '🇲🇦';
            if (n.includes('us open') || n.includes('new york') || n.includes('cincinnati') || n.includes('toronto') || n.includes('montreal')) return '🇺🇸';
            if (n.includes('australian') || n.includes('melbourne')) return '🇦🇺';
            return '🎾';
          }

          async function getActiveSports() {
            const all = await apiGet('/v4/sports/?apiKey=' + process.env.ODDS_API_KEY);
            return (Array.isArray(all) ? all : [])
              .filter(s => s.group === 'Tennis' && s.active)
              .map(s => s.key);
          }

          async function main() {
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toISOString().slice(0,10);

            console.log('Fetching active tennis sports...');
            const sports = await getActiveSports();
            console.log('Active sports:', sports.length);

            const allMatches = {};
            const oddsIndex = {};
            const todayMatchesByKey = {}; // pour le bilan

            // ── MATCHS ET COTES DU JOUR ──────────────────────────────────────
            for (let i = 0; i < sports.length; i++) {
              const sport = sports[i];
              await sleep(300);
              const events = await apiGet(
                '/v4/sports/' + sport + '/odds/?apiKey=' + process.env.ODDS_API_KEY +
                '&regions=eu&markets=h2h&oddsFormat=decimal&bookmakers=betclic,unibet,winamax,bet365,pinnacle'
              );
              if (!Array.isArray(events) || !events.length) { console.log(sport, ': no data'); continue; }
              console.log(sport, ':', events.length, 'events');

              events.forEach(event => {
                const date = event.commence_time ? event.commence_time.slice(0,10) : null;
                if (!date) return;
                const p1 = event.home_team || '', p2 = event.away_team || '';
                if (!p1 || !p2) return;
                const tournName = event.sport_title || sport;
                const surface = getSurface(sport, tournName);
                const flag = getFlag(tournName);

                let timeStr = '--:--';
                if (event.commence_time) {
                  const d = new Date(event.commence_time);
                  const h = d.getUTCHours() + 2;
                  timeStr = String(h).padStart(2,'0') + 'h' + String(d.getUTCMinutes()).padStart(2,'0');
                }

                if (!allMatches[date]) allMatches[date] = {data: []};
                allMatches[date].data.push({
                  id: event.id, date: event.commence_time,
                  player1: {name: p1}, player2: {name: p2},
                  tour: sport.includes('wta') ? 'wta' : 'atp',
                  time: timeStr, scheduled: true,
                  tournament: {name: tournName, surface, flag}
                });

                const bookmakers = event.bookmakers || [];
                const bestOdds = {p1: null, p2: null, p1name: p1, p2name: p2};
                bookmakers.forEach(bk => {
                  const market = (bk.markets || []).find(m => m.key === 'h2h');
                  if (!market) return;
                  const outcomes = market.outcomes || [];
                  const o1 = outcomes.find(o => o.name === p1);
                  const o2 = outcomes.find(o => o.name === p2);
                  if (o1 && (!bestOdds.p1 || o1.price > bestOdds.p1)) bestOdds.p1 = o1.price;
                  if (o2 && (!bestOdds.p2 || o2.price > bestOdds.p2)) bestOdds.p2 = o2.price;
                });

                if (bestOdds.p1 && bestOdds.p2) {
                  const key = [p1, p2].sort().join('|').toLowerCase();
                  oddsIndex[key] = bestOdds;
                  todayMatchesByKey[key] = {p1, p2, odds1: bestOdds.p1, odds2: bestOdds.p2, date, tournName};
                }
              });
            }

            let total = 0;
            Object.keys(allMatches).sort().forEach(d => { const n = allMatches[d].data.length; total += n; console.log(d, ':', n, 'matches'); });
            console.log('Total:', total);
            fs.writeFileSync('matches.json', JSON.stringify(allMatches, null, 2));
            fs.writeFileSync('odds.json', JSON.stringify(oddsIndex, null, 2));

            // ── RÉSULTATS DE LA VEILLE ────────────────────────────────────────
            console.log('Fetching results for', yesterdayStr);
            const completedMatches = [];

            for (let i = 0; i < sports.length; i++) {
              await sleep(400);
              const sport = sports[i];
              const res = await apiGet(
                '/v4/sports/' + sport + '/scores/?apiKey=' + process.env.ODDS_API_KEY +
                '&daysFrom=1&dateFormat=iso'
              );
              if (!Array.isArray(res)) continue;
              res.forEach(event => {
                if (!event.completed) return;
                const date = event.commence_time ? event.commence_time.slice(0,10) : null;
                if (date !== yesterdayStr) return;
                const p1 = event.home_team, p2 = event.away_team;
                if (!p1 || !p2) return;
                const scores = event.scores || [];
                let winner = null;
                if (scores.length >= 2) {
                  const s1 = parseFloat(scores[0]?.score || 0);
                  const s2 = parseFloat(scores[1]?.score || 0);
                  winner = s1 > s2 ? p1 : p2;
                }
                if (winner) completedMatches.push({p1, p2, winner, sport, date, id: event.id});
              });
            }

            console.log('Completed matches yesterday:', completedMatches.length);

            // ── CALCUL BILAN JOURNALIER ───────────────────────────────────────
            // Charger le results.json existant
            let resultsData = {};
            try { resultsData = JSON.parse(fs.readFileSync('results.json', 'utf8')); } catch(e) {}

            if (completedMatches.length > 0) {
              // Charger le matches.json de la veille depuis odds.json (on a les cotes)
              // On calcule le bilan sans les probas CSV (pas dispo ici) — on utilise les cotes implicites
              let dayScore = 0, dayCorrect = 0, dayTotal = 0;
              const dayDetails = [];

              completedMatches.forEach(m => {
                const key = [m.p1, m.p2].sort().join('|').toLowerCase();
                const odds = oddsIndex[key];
                if (!odds) return;

                // Probabilité implicite depuis les cotes (bookmaker)
                const prob1 = Math.round(100 / odds.p1);
                const prob2 = Math.round(100 / odds.p2);

                const isP1Winner = m.winner === m.p1;
                const predWinner = prob1 > prob2 ? m.p1 : m.p2;
                const predProb = prob1 > prob2 ? prob1 : prob2;

                const correct = m.winner === predWinner;
                const score = correct ? predProb / 100 : -(predProb / 100);

                dayScore += score;
                dayTotal++;
                if (correct) dayCorrect++;

                dayDetails.push({
                  p1: m.p1, p2: m.p2, winner: m.winner,
                  pred: predWinner, predProb, correct, score: Math.round(score * 100) / 100
                });
              });

              if (dayTotal > 0) {
                const dayScorePct = Math.round((dayScore / dayTotal) * 100);
                resultsData[yesterdayStr] = {
                  date: yesterdayStr,
                  total: dayTotal,
                  correct: dayCorrect,
                  accuracy: Math.round(dayCorrect / dayTotal * 100),
                  score: dayScorePct,
                  details: dayDetails
                };
                console.log('Day score:', dayScorePct + '%', '| Accuracy:', Math.round(dayCorrect/dayTotal*100) + '%');
              }
            }

            fs.writeFileSync('results.json', JSON.stringify(resultsData, null, 2));
            console.log('Done!');
          }

          main().catch(console.error);
          "

      - name: Commit files
        run: |
          git config user.name "ColliGoat Bot"
          git config user.email "bot@colligoat.com"
          git add matches.json odds.json results.json
          git diff --staged --quiet || git commit -m "Update matches, odds and results $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
