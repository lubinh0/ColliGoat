name: Update Tennis Matches

on:
  schedule:
    - cron: '0 5 * * *'  # Tous les jours à 6h heure française
  workflow_dispatch:      # Permet de lancer manuellement

jobs:
  fetch-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch matches from RapidAPI
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          const today = new Date();
          const endDate = new Date(today);
          endDate.setDate(endDate.getDate() + 6);

          const fmt = d => d.toISOString().slice(0,10);
          const startStr = fmt(today);
          const endStr = fmt(endDate);

          console.log('Fetching ATP fixtures from', startStr, 'to', endStr);

          const allMatches = {};
          let done = 0;
          const tours = ['atp', 'wta'];

          function fetchTour(tour) {
            const path = '/tennis/v2/' + tour + '/fixtures/' + startStr + '/' + endStr;
            const options = {
              method: 'GET',
              hostname: 'tennis-api-atp-wta-itf.p.rapidapi.com',
              path: path,
              headers: {
                'X-RapidAPI-Key': process.env.RAPIDAPI_KEY,
                'X-RapidAPI-Host': 'tennis-api-atp-wta-itf.p.rapidapi.com'
              }
            };

            const req = https.request(options, res => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try {
                  const parsed = JSON.parse(data);
                  console.log('Tour:', tour, '- Status:', res.statusCode);
                  const fixtures = parsed.data || parsed || [];
                  if (Array.isArray(fixtures)) {
                    fixtures.forEach(m => {
                      const date = (m.date || m.startDate || startStr).slice(0,10);
                      if (!allMatches[date]) allMatches[date] = {data: []};
                      allMatches[date].data.push({...m, tour});
                    });
                  }
                } catch(e) {
                  console.error('Parse error for', tour, ':', e.message);
                }
                done++;
                if (done === tours.length) {
                  fs.writeFileSync('matches.json', JSON.stringify(allMatches, null, 2));
                  console.log('matches.json updated with', Object.keys(allMatches).length, 'days');
                  Object.keys(allMatches).forEach(d => {
                    console.log(d, ':', allMatches[d].data.length, 'matches');
                  });
                }
              });
            });
            req.on('error', e => {
              console.error('Request error for', tour, ':', e.message);
              done++;
            });
            req.end();
          }

          // Espacer les requêtes de 1 seconde pour éviter rate limit
          tours.forEach((tour, i) => {
            setTimeout(() => fetchTour(tour), i * 1000);
          });

          // Attendre que tout soit fini (max 30s)
          setTimeout(() => {
            if (done < tours.length) {
              console.log('Timeout - saving partial results');
              fs.writeFileSync('matches.json', JSON.stringify(allMatches, null, 2));
            }
          }, 30000);
          "

      - name: Commit matches.json
        run: |
          git config user.name "ColliGoat Bot"
          git config user.email "bot@colligoat.com"
          git add matches.json
          git diff --staged --quiet || git commit -m "Update matches $(date +%Y-%m-%d)"
          git push
