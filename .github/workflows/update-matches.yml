name: Update Tennis Matches

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fetch-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch matches from RapidAPI
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function apiGet(path) {
            return new Promise((resolve) => {
              const options = {
                method: 'GET',
                hostname: 'tennis-api-atp-wta-itf.p.rapidapi.com',
                path,
                headers: {
                  'X-RapidAPI-Key': process.env.RAPIDAPI_KEY,
                  'X-RapidAPI-Host': 'tennis-api-atp-wta-itf.p.rapidapi.com'
                }
              };
              const req = https.request(options, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { resolve({}); }
                });
              });
              req.on('error', () => resolve({}));
              req.end();
            });
          }

          async function getTournamentMatches(tournamentId, tour) {
            let page = 1;
            let allMatches = [];
            let hasNext = true;

            while (hasNext && page <= 10) {
              const res = await apiGet('/tennis/v2/' + tour + '/tournament/fixtures/' + tournamentId + '?page=' + page);
              const matches = res.data || [];
              allMatches = allMatches.concat(matches);
              hasNext = res.hasNextPage === true;
              page++;
              if (hasNext) await sleep(500);
            }

            return allMatches.filter(m => {
              const p1 = m.player1?.name || '';
              const p2 = m.player2?.name || '';
              return !p1.includes('/') && !p2.includes('/');
            });
          }

          async function main() {
            const today = new Date();
            const endDate = new Date(today);
            endDate.setDate(endDate.getDate() + 7);
            const fmt = d => d.toISOString().slice(0,10);
            const startStr = fmt(today);
            const endStr = fmt(endDate);

            console.log('Fetching matches from', startStr, 'to', endStr);

            const [atpCalendar, wtaCalendar] = await Promise.all([
              apiGet('/tennis/v2/atp/tournament/calendar/2026'),
              sleep(1000).then(() => apiGet('/tennis/v2/wta/tournament/calendar/2026'))
            ]);

            const atpTournaments = (atpCalendar.data || []).filter(t => {
              const start = t.startDate || t.dateFrom || '';
              const end = t.endDate || t.dateTo || '';
              return start <= endStr && end >= startStr;
            });

            const wtaTournaments = (wtaCalendar.data || []).filter(t => {
              const start = t.startDate || t.dateFrom || '';
              const end = t.endDate || t.dateTo || '';
              return start <= endStr && end >= startStr;
            });

            console.log('Active ATP tournaments:', atpTournaments.length);
            console.log('Active WTA tournaments:', wtaTournaments.length);

            const allMatches = {};

            const allTournaments = [
              ...atpTournaments.map(t => ({...t, tour: 'atp'})),
              ...wtaTournaments.map(t => ({...t, tour: 'wta'}))
            ];

            for (let i = 0; i < allTournaments.length; i++) {
              const t = allTournaments[i];
              const tId = t.id || t.tournamentId;
              console.log('Fetching tournament', tId, t.name || '', '(' + t.tour + ')');

              const matches = await getTournamentMatches(tId, t.tour);
              console.log(' ->', matches.length, 'singles matches');

              matches.forEach(m => {
                if (!m.date) return;
                const date = m.date.slice(0,10);
                if (date < startStr || date > endStr) return;

                if (!allMatches[date]) allMatches[date] = {data: []};
                allMatches[date].data.push({
                  ...m,
                  tour: t.tour,
                  tournament: {
                    name: t.name || t.tournamentName || 'Tournoi ' + tId,
                    surface: t.surface || t.courtType || 'Clay',
                    country: t.country || '',
                    countryAcr: t.countryAcr || ''
                  }
                });
              });

              if (i < allTournaments.length - 1) await sleep(600);
            }

            let total = 0;
            Object.keys(allMatches).sort().forEach(date => {
              const n = allMatches[date].data.length;
              total += n;
              console.log(date, ':', n, 'matches');
            });
            console.log('Total:', total, 'matches across', Object.keys(allMatches).length, 'days');

            fs.writeFileSync('matches.json', JSON.stringify(allMatches, null, 2));
            console.log('Done!');
          }

          main().catch(console.error);
          "

      - name: Commit matches.json
        run: |
          git config user.name "ColliGoat Bot"
          git config user.email "bot@colligoat.com"
          git add matches.json
          git diff --staged --quiet || git commit -m "Update matches $(date +%Y-%m-%d)"
          git push
